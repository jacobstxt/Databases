version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: course-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: coursedb
      POSTGRES_USER: student
      POSTGRES_PASSWORD: student_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d coursedb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: